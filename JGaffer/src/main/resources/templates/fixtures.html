<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'JGaffer &mdash; ' + ${teamName} + ' Fixtures'">JGaffer &mdash; Fixtures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="fixtures-page">

    <div class="fixtures-page-hero">
        <h1 class="fixtures-team-title" th:text="${teamName}">Team</h1>
        <p class="hero-sub">Select a fixture to load the match context.</p>
    </div>

    <div class="fixtures-panels">

        <!-- Left panel: Home -->
        <div class="fixtures-panel">
            <div class="fixtures-section-header">Home</div>
            <ul class="fixture-list fixture-2col">
                <li th:each="fixture : ${homeFixtures}">
                    <a th:href="@{/match(matchId=${fixture.id}, teamId=${teamId})}" class="fixture-row">
                        <span class="fixture-pills">
                            <span class="pill pill-home" th:text="${#strings.substringBefore(fixture.title, '-')}"></span>
                            <span class="fixture-vs">vs</span>
                            <span class="pill pill-away" th:text="${#strings.substringAfter(fixture.title, '-')}"></span>
                        </span>
                        <span class="fixture-arrow">&#8594;</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Divider -->
        <div class="fixtures-panel-divider"></div>

        <!-- Right panel: Away -->
        <div class="fixtures-panel">
            <div class="fixtures-section-header">Away</div>
            <ul class="fixture-list fixture-2col">
                <li th:each="fixture : ${awayFixtures}">
                    <a th:href="@{/match(matchId=${fixture.id}, teamId=${teamId})}" class="fixture-row">
                        <span class="fixture-pills">
                            <span class="pill pill-home" th:text="${#strings.substringBefore(fixture.title, '-')}"></span>
                            <span class="fixture-vs">vs</span>
                            <span class="pill pill-away" th:text="${#strings.substringAfter(fixture.title, '-')}"></span>
                        </span>
                        <span class="fixture-arrow">&#8594;</span>
                    </a>
                </li>
            </ul>
        </div>

    </div>

    <div class="fixtures-back">
        <a th:href="@{/}" class="btn-back">&#8592; Back to Club Selection</a>
    </div>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
